name: Formatar correlação fromMe (temporário)
on:
  push:
    branches: [feat/flowbot-echo-provenance-20261123]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Prettier nos arquivos da PR #11
        run: |
          npx prettier --write packages/channel-evolution/src/entrada.ts packages/channel-evolution/src/index.ts packages/channel-evolution/test/evolution.test.ts packages/store-postgres/src/flowbot.ts packages/store-postgres/test/flowbot.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/channel-evolution/src/entrada.ts packages/channel-evolution/src/index.ts packages/channel-evolution/test/evolution.test.ts packages/store-postgres/src/flowbot.ts packages/store-postgres/test/flowbot.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar correlação de fromMe"
            git push origin HEAD:refs/heads/feat/flowbot-echo-provenance-20261123
          fi
