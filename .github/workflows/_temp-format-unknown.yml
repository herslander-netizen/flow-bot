name: Formatar PR10 temporariamente
on:
  push:
    branches: [fix/flowbot-unknown-queue-gate-20261123]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Corrigir somente arquivos da PR10
        run: |
          npx prettier --write docs/CONCILIACAO_ENVIOS.md packages/store-postgres/src/flowbot.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CONCILIACAO_ENVIOS.md packages/store-postgres/src/flowbot.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar proteção de unknown"
            git push origin HEAD:refs/heads/fix/flowbot-unknown-queue-gate-20261123
          fi
