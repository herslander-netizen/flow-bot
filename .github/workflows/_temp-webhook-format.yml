name: Format webhook isolation branch (temporary)
on:
  push:
    branches:
      - fix/flowbot-webhook-isolation-20261123
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format only webhook isolation code
        run: |
          npx prettier --write packages/server/src/config.ts packages/server/test/gateway-alvo.test.ts packages/server/test/webhook-isolation.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/server/src/config.ts packages/server/test/gateway-alvo.test.ts packages/server/test/webhook-isolation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar autenticação de webhook por instância"
            git push origin HEAD:refs/heads/fix/flowbot-webhook-isolation-20261123
          fi
