name: Format Claude Authoring (temporary)
on:
  push:
    branches:
      - feat/flowbot-claude-attendance-gateway-20261123
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format only authoring files
        run: |
          npx prettier --write docs/CLAUDE_GATEWAY.md packages/server/bin/claude-author.mjs packages/server/src/claude-gateway.ts packages/server/test/claude-gateway.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CLAUDE_GATEWAY.md packages/server/bin/claude-author.mjs packages/server/src/claude-gateway.ts packages/server/test/claude-gateway.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar oficina multiagente Claude"
            git push origin HEAD:refs/heads/feat/flowbot-claude-attendance-gateway-20261123
          fi
